<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <title>Score keeper app</title>
</head>
<body>
    <div id="root" style="text-align: center;">

    </div>
    <script type="text/babel">
        let score=0;
        let wicket=0;
        let ballWise=[];
        let ballWiseResult=[];
        let hit=0;
        let inputRef=React.createRef();
        function addScore(num){
            if(wicket<10){
                hit=num;
            ballWise.push(num);
            score+=num;
            renderRoot.render(<App/>)

            }
            


        }
        function addWicket(){
            if(wicket<10){
                hit="W"
                ballWise.push("W");
                wicket++;
                renderRoot.render(<App/>)
            }

        }
        function handleSubmit(event){
            event.preventDefault();

            ballWiseResult.unshift(
                <span>{`${hit}, ${inputRef.current.value} `}</span>
            );
            renderRoot.render(<App/>);

        }
        const ScoreButton=()=>(
                    <div>
                    <button onClick={()=>addScore(0)}>0</button>
                    <button onClick={()=>addScore(1)}>1</button>
                    <button onClick={()=>addScore(2)}>2</button>
                    <button onClick={()=>addScore(3)}>3</button>
                    <button onClick={()=>addScore(4)}>4</button>
                    <button onClick={()=>addScore(5)}>5</button>
                    <button onClick={()=>addScore(6)}>6</button>
                    <button onClick={addWicket}>wicket</button>
                    
                    </div>

                )
        const Result=()=>(
            <div>
            { ballWise.map((res,index)=>(
                <>
                {index%6===0 ?<br/>:null}
                <span key={index}>{res===0 ? <strong>.</strong>:res }</span>&nbsp;&nbsp;&nbsp;&nbsp;
                </>





            ))}

            </div>
        )
        const Form=()=>(
            <form onSubmit={handleSubmit}>
                <input value={hit}/>
                <input ref={inputRef} placeholder="Add a comment" />
                <button>Submit</button>
            
            </form>
        )
        function App(){
            return(
                <>
                <h1>Scorer Keeper</h1>
                <h4>Score:{score}/{wicket}</h4>
                <ScoreButton/>
                <br/>
                <Form/>
                <hr/>
                {ballWiseResult.map((res)=>(
                    <p>{res}</p>
                ))}
                
                </>

            )

        }
        const renderRoot=ReactDOM.createRoot(document.getElementById("root"));
        renderRoot.render(<App/>)


    </script>
    
</body>
</html>
